version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Botocore requires python-dateutil <3. Review when upgrading Botocore.
    ignore:
      - dependency-name: python-dateutil
        versions: ['>=3.0.0']
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
